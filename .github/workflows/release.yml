name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing tag to use for the GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install Ubuntu native dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libgdk-pixbuf2.0-dev libcairo2-dev libpango1.0-dev libatk1.0-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libfuse2 fuse squashfs-tools libarchive-tools

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        run: npm run build

      - name: List bundles (debug)
        run: |
          echo "Listing candidate bundle directories"
          ls -la src-tauri/target/release/bundle || true
          ls -la target/release/bundle || true

      - name: Optional Windows code signing
        if: matrix.os == 'windows-latest'
        env:
          WIN_SIGNING_CERT: ${{ secrets.WIN_SIGNING_CERT }}
          WIN_SIGNING_PASSWORD: ${{ secrets.WIN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$WIN_SIGNING_CERT" ] || [ -z "$WIN_SIGNING_PASSWORD" ]; then
            echo "Windows signing secrets not configured; skipping."
            exit 0
          fi
          echo "Preparing Windows signing"
          echo "$WIN_SIGNING_CERT" | base64 -d > signing.pfx
          choco install -y osslsigncode || true
          # find EXE installer and sign it (adjust pattern as needed)
          exe=$(find src-tauri/target -type f -iname "*.exe" | head -n1 || true)
          if [ -n "$exe" ]; then
            echo "Signing $exe"
            osslsigncode sign -pkcs12 signing.pfx -pass "$WIN_SIGNING_PASSWORD" -n "code-intel-desktop" -i "https://example.com" -t http://timestamp.digicert.com -in "$exe" -out "$exe.signed" || true
          else
            echo "No .exe found to sign"
          fi

      - name: Optional macOS notarization
        if: matrix.os == 'macos-latest'
        env:
          APP_KEY: ${{ secrets.APPLE_API_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          if [ -z "$APP_KEY" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER" ]; then
            echo "macOS notarization secrets not configured; skipping."
            exit 0
          fi
          echo "$APP_KEY" > /tmp/AuthKey.p8
          # find dmg or pkg to notarize
          artifact=$(find src-tauri/target -type f \( -iname "*.dmg" -o -iname "*.pkg" -o -iname "*.app" \) | head -n1 || true)
          if [ -n "$artifact" ]; then
            echo "Notarizing $artifact"
            xcrun notarytool submit "$artifact" --key /tmp/AuthKey.p8 --key-id "$KEY_ID" --issuer "$ISSUER" --wait || true
            xcrun stapler staple "$artifact" || true
          else
            echo "No macOS bundle found to notarize"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
            target/release/bundle/**

  create_release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Download ubuntu artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-ubuntu-latest
          path: artifacts/ubuntu

      - name: Download windows artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-windows-latest
          path: artifacts/windows

      - name: Download macos artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-macos-latest
          path: artifacts/macos

      - name: Create GitHub Release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          name: Release ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
          files: |
            artifacts/ubuntu/**
            artifacts/windows/**
            artifacts/macos/**
