name: Release Drafter
tag-template: 'v$NEXT_PATCH'
categories:
  - title: '🚀 Added'
    label: 'feature'
  - title: '🐛 Fixed'
    label: 'bug'
  - title: '🧰 Maintenance'
    label: 'chore'
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
no-changes-template: '- No notable changes'
template: |
  ## Changes

  $CHANGES

  <!-- Do not edit this file. It is managed by Release Drafter -->
